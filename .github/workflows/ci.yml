name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build WiiUVirtualConsoleInjector/WiiUVirtualConsoleInjector.csproj --configuration Release

      - name: Test
        shell: bash
        run: |
          for p in .tests/*/*.Tests.csproj; do
            dotnet test "$p" --configuration Release --logger "trx;LogFileName=results.trx"
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  release:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      matrix:
        rid: [win-x64, linux-x64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        id: version
        shell: bash
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: >
          dotnet publish WiiUVirtualConsoleInjector/WiiUVirtualConsoleInjector.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained
          -p:Version=${{ steps.version.outputs.number }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          --output publish/${{ matrix.rid }}

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath WiiUVirtualConsoleInjector-${{ steps.version.outputs.number }}-${{ matrix.rid }}.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: WiiUVirtualConsoleInjector-${{ steps.version.outputs.number }}-${{ matrix.rid }}.zip
          generate_release_notes: true
          prerelease: true
